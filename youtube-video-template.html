<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Template</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,100&display=swap');

        :root {
            --bg: #000000;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .layout {
            width: 100%;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .left-pane {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .main-image {
            width: 1000px;
            height: 1000px;
            object-fit: cover;
        }

        .right-pane {
            position: relative;
            min-height: 100vh;
            /* Pas de padding-top : top:absolute du titre est mesuré depuis le haut du panneau = haut de page (colonne droite). */
            padding: 0 24px 24px;
        }

        /* Importation d'une police proche de l'exemple (Montserrat) */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,100&display=swap');

        .artist-crop {
            position: absolute;
            left: 50%;
            top: 150px;
            transform: translateX(-50%);
            width: 615px;
            height: 345px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            /* Pas de padding-top pour que le titre soit bien à `top` px du bord (sinon +12px visuel). */
            padding: 0 16px 12px;
            font-family: "Montserrat", sans-serif;
        }

        .artist-name {
            margin-top: 2px;
            font-size: 1.55rem;
            font-weight: 100; /* Très fin */
            font-style: oblique 10deg;
            color: rgba(255, 255, 255, 0.70); /* Couleur spécifiée dans votre JSON */
            letter-spacing: 2px;
        }     

        .track-title-container {
            position: relative;
            isolation: isolate;
            font-size: clamp(1.65rem, 2.7vw, 2.85rem);
            font-weight: 500;
            color: #ffffff;
            text-transform: none;
            line-height: 1.1;
            text-align: center;
        }

        .track-title-container::before {
            content: attr(data-text);
            position: absolute;
            left: -3px;
            top: 0;
            color: #ff0050;
            z-index: -1;
        }

        .track-title-container::after {
            content: attr(data-text);
            position: absolute;
            left: 3px;
            top: 0;
            color: #00f2ea;
            z-index: -1;
        }    

        @media (max-width: 2100px) {
            .main-image {
                width: min(46vw, 1000px);
                height: min(46vw, 1000px);
            }
        }

        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
            }

            .right-pane {
                min-height: 45vh;
            }

            .artist-crop {
                position: static;
                transform: none;
                margin: 150px auto 0;
            }
        }
    </style>
</head>
<body>
    <main class="layout">
        <section class="left-pane">
        </section>
        <section class="right-pane">
            <div class="artist-crop">
                <div class="track-title-container" data-text="Electronic Playlist">Electronic Playlist</div>
                <div class="artist-name">by Foxall</div>
            </div>
        </section>
    </main>
</body>
</html>
