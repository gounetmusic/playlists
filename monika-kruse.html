    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlaylist",
      "name": "Monika Kruse",
      "creator": {
        "@type": "Person",
        "name": "Gounet"
      },
      "image": "https://cdn-images.dzcdn.net/images/cover/3b04dfe2ad50524a63bfade40861a63a-35121c5826c2d34dade82d6ee2543d99-c878d592a54e0f42b34b7bb182c9b1fb-4d678843d5e750ee0d7ff6463e96bde3/1000x1000-000000-80-0-0.jpg",
      "description": "Link to streaming platforms for the selection of Monika Kruse."
    }
    </script>

    <style>
        :root {
            --bg-overlay: rgba(15, 15, 15, 0.85);
            --card: rgb(0, 0, 0);
            --text: #ffffff;
            --subtext: #a0a0a0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0f0f0f;
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* Aligne le contenu vers le haut */
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden;
        }

        
        .background-blur {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;         
            background-image: url('https://cdn-images.dzcdn.net/images/cover/3b04dfe2ad50524a63bfade40861a63a-35121c5826c2d34dade82d6ee2543d99-c878d592a54e0f42b34b7bb182c9b1fb-4d678843d5e750ee0d7ff6463e96bde3/1000x1000-000000-80-0-0.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(20px);
            -webkit-filter: blur(20px);
            transform: scale(1.1);
            z-index: -2;
        }

        .background-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-overlay);
            z-index: -1;
        }

        .container { 
            width: 95%; 
            max-width: 400px; 
            text-align: center; 
            padding: 20px 20px 40px 20px;
            position: relative;
            z-index: 1;
            margin-top: 5vh;
        }

        .cover { 
            width: 50%;          
            max-width: 240px;   
            min-width: 150px;
            aspect-ratio: 1 / 1; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .artist-crop {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            border-radius: 8px;
            overflow: hidden;
            background-color: #1a1a1a;
            aspect-ratio: 4 / 1; 
        }

        /* Importation d'une police proche de l'exemple (Montserrat) */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,100&display=swap');

	.artist-crop {
		width: 100%;
		max-width: 400px;
		margin: 0 auto 18px auto;
		border-radius: 12px;
		overflow: hidden;
		background-color: #000000;
		aspect-ratio: 4 / 0.95;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		padding: 12px 16px;
		box-sizing: border-box;
		font-family: 'Montserrat', sans-serif;
	}

        /* Effet Glitch / Chromatique pour le titre (House tracks) */
        .track-title-container {
            position: relative;
            isolation: isolate;
            font-size: 2rem;
            font-weight: 600;
            color: #FFFFFF;
            text-transform: none;
            line-height: 1.1;
        }

        /* Le texte rose en arrière-plan (décalé à gauche) */
        .track-title-container::before {
            content: attr(data-text);
            position: absolute;
            left: -2px;
            top: 0;
            color: #ff0050; /* Couleur spécifiée dans votre JSON */
            z-index: -1;
        }

        /* Le texte cyan en arrière-plan (décalé à droite) */
        .track-title-container::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 0;
            color: #00f2ea; /* Couleur complémentaire pour l'effet TikTok */
            z-index: -1;
        }

        /* Style pour "by Artist Name" */
        .artist-name {
            margin-top: 2px;
            font-size: 1.5rem;
            font-weight: 100; /* Très fin */
            font-style: oblique 10deg;
            color: rgba(255, 255, 255, 0.70); /* Couleur spécifiée dans votre JSON */
            letter-spacing: 2px;
        }           

        .link-card { 
            background: var(--card); 
            display: flex; 
            align-items: center; 
            padding: 14px 18px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: white; 
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s ease-in-out;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .link-card:hover { background: rgba(40, 40, 40, 0.95); transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }

        .platform-icon { 
            width: 32px;
            height: 32px; 
            margin-right: 15px; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            border-radius: 6px;
        }

        .platform-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .platform-name { flex-grow: 1; text-align: left; font-weight: 600; font-size: 1rem; }

        .btn-play { font-size: 0.7rem; color: var(--subtext); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .amazon-icon-bg {
            background-color: #ffffff !important;
            padding: 3px;
            box-sizing: border-box;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="background-blur"></div>
    <div class="background-overlay"></div>
    <div class="container">
        
        <img src="https://cdn-images.dzcdn.net/images/cover/3b04dfe2ad50524a63bfade40861a63a-35121c5826c2d34dade82d6ee2543d99-c878d592a54e0f42b34b7bb182c9b1fb-4d678843d5e750ee0d7ff6463e96bde3/1000x1000-000000-80-0-0.jpg" alt="Cover Monika Kruse" class="cover">
        
        <div class="artist-crop">
            <!-- On utilise data-text pour que le CSS puisse dupliquer le texte pour l'effet glitch -->
            <div class="track-title-container" data-text="Techno Playlist">
                Techno Playlist
            </div>
            <div class="artist-name">
                by Monika Kruse
            </div>
        </div>

        <a href="https://open.spotify.com/playlist/1pvfdzGJm0wt5ndywiM1XF" class="link-card">
            <div class="platform-icon"><img src="https://cdn.simpleicons.org/spotify/1DB954" alt="Spotify"></div>
            <span class="platform-name">Spotify</span>
            <span class="btn-play">Play</span>
        </a>

        <a href="https://www.youtube.com/playlist?list=PL6C0oh__XypR0fnoQSbWefnIEbfSakI25" class="link-card">
            <div class="platform-icon"><img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube"></div>
            <span class="platform-name">YouTube</span>
            <span class="btn-play">Play</span>
        </a>

        <a href="https://www.deezer.com/en/playlist/15057179503" class="link-card">
            <div class="platform-icon"><img src="https://cdn.simpleicons.org/deezer/A238FF" alt="Deezer"></div>
            <span class="platform-name">Deezer</span>
            <span class="btn-play">Play</span>
        </a>

        <a href="https://music.amazon.fr/user-playlists/cd0fff07c7fb4789872c1b6539678e17frfr" class="link-card">
            <div class="platform-icon amazon-icon-bg"><img src="https://cloudinary-cdn.ffm.to/s--Qpi3CZYi--/w_64,h_64,c_limit/f_png/https%3A%2F%2Fassets.ffm.to%2Fimages%2Flogo%2Fmusic-service_amazon_without_text_new_branding.png" alt="Amazon Music"></div>
            <span class="platform-name">Amazon Music</span>
            <span class="btn-play">Play</span>
        </a>

    </div>
</body>
